<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>News Summarizer</title>
  <link rel="stylesheet" href="output.css">
  <style>
    :root {
      --font-sans: 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-display: 'Manrope', 'SF Pro Display', 'Segoe UI', sans-serif;
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 2s infinite linear;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    body {
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-glacier-50 h-screen font-sans text-slate-800">
  <div class="flex flex-col h-full max-w-full overflow-hidden" id="app-root">
    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-5 border-b border-glacier-100 bg-white/80 backdrop-blur-md sticky top-0 z-10">
      <h1 class="text-xl font-display font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
        <span class="text-primary">📰</span> News Summarizer
      </h1>
      <div class="flex items-center gap-2">
        <button id="settings-btn" aria-label="Settings" class="p-2 text-slate-400 hover:text-primary hover:bg-primary/5 rounded-full transition-all">
          <svg fill="none" height="20" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
            <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto px-6 py-6 flex flex-col gap-8">
      
      <!-- Controls -->
      <section id="controls-section" class="space-y-6">
        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">Summary Style</label>
            <select id="style-select" class="w-full h-11 px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none appearance-none cursor-pointer">
              <option value="key-points">Bullet Points</option>
              <option value="tldr">Paragraph</option>
              <option value="teaser">Key Takeaways</option>
            </select>
          </div>
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">Length</label>
            <select id="length-select" class="w-full h-11 px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none appearance-none cursor-pointer">
              <option value="short">Brief</option>
              <option value="medium" selected>Medium</option>
              <option value="long">Detailed</option>
            </select>
          </div>
        </div>
        
        <button id="summarize-btn" class="w-full h-14 bg-primary text-white font-bold rounded-2xl shadow-xl shadow-primary/20 hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-3 group">
          <span id="btn-text">Generate Summary</span>
          <svg id="btn-icon" fill="none" height="20" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg" class="group-hover:translate-x-1 transition-transform">
            <path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <div id="loading-spinner" class="hidden">
            <svg class="animate-spin h-5 w-5 text-white" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
            </svg>
          </div>
        </button>
      </section>

      <!-- Output Area -->
      <section id="output-section" class="flex-1 flex flex-col min-h-[300px]">
        <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-center p-8 border-2 border-dashed border-slate-200 rounded-3xl bg-slate-50/50">
          <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-sm mb-4">
            <span class="text-4xl">✨</span>
          </div>
          <h3 class="text-lg font-bold text-slate-800 mb-2">Ready to Summarize</h3>
          <p class="text-sm text-slate-500 max-w-[200px]">Open any news article and click the button above to get AI-powered insights.</p>
        </div>

        <div id="summary-container" class="hidden flex-1 flex flex-col bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden p-6 relative">
          <!-- Thinking State Overlay -->
          <div id="thinking-overlay" class="hidden absolute inset-0 bg-white/90 backdrop-blur-sm z-20 flex flex-col items-center justify-center gap-6 px-8 text-center">
            <div class="relative flex items-center justify-center">
              <div class="absolute w-20 h-20 bg-primary/10 rounded-full animate-pulse-slow"></div>
              <div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center shadow-lg shadow-primary/30">
                <svg class="animate-spin h-6 w-6 text-white" viewbox="0 0 24 24">
                  <path d="M12,4V2A10,10 0 0,0 2,12H4A8,8 0 0,1 12,4Z" fill="currentColor"></path>
                </svg>
              </div>
            </div>
            <div class="space-y-3 w-full max-w-[200px]">
              <p id="thinking-status" class="text-sm font-bold text-slate-700 tracking-wide">AI is analyzing...</p>
              <div id="download-progress-container" class="hidden w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div id="download-progress-bar" class="h-full bg-primary transition-all duration-300" style="width: 0%"></div>
              </div>
              <p id="download-percentage" class="hidden text-[10px] font-bold text-slate-400 uppercase tracking-widest">0%</p>
            </div>
          </div>

          <!-- Summary Content -->
          <div id="summary-content" class="prose prose-slate max-w-none text-slate-700 leading-relaxed text-[15px]">
            <!-- Content injected here -->
          </div>
        </div>
      </section>
    </main>

    <!-- Footer Action Bar -->
    <footer id="action-bar" class="hidden border-t border-glacier-100 bg-white/90 backdrop-blur-md px-6 py-5 grid grid-cols-3 gap-3">
      <button id="copy-btn" class="flex flex-col items-center justify-center gap-1.5 py-2 text-slate-500 hover:text-primary transition-colors">
        <svg fill="none" height="20" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span class="text-[10px] font-bold uppercase tracking-wider">Copy</span>
      </button>
      <button id="share-btn" class="flex flex-col items-center justify-center gap-1.5 py-2 text-slate-500 hover:text-primary transition-colors">
        <svg fill="none" height="20" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
          <path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span class="text-[10px] font-bold uppercase tracking-wider">Share</span>
      </button>
      <button id="translate-btn" class="flex flex-col items-center justify-center gap-1.5 py-2 text-slate-500 hover:text-primary transition-colors">
        <svg fill="none" height="20" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span class="text-[10px] font-bold uppercase tracking-wider">Translate</span>
      </button>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
